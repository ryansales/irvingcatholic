[build]
  # Publish site/, not the repo root. Everything a visitor can reach lives in
  # that one folder; the README, the SEO notes in docs/, the checks in
  # scripts/ and tests/, the raw research in review/, and the .dc.html design
  # sources all sit above it and are therefore never served. That boundary
  # replaces the per-file X-Robots-Tag and robots.txt allowlist this file used
  # to carry — a new doc or research file is out of the deploy by default
  # instead of by remembering to add a rule.
  publish = "site"

[[redirects]]
  from = "https://www.irving-catholic.net/*"
  to = "https://irving-catholic.net/:splat"
  status = 301
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
