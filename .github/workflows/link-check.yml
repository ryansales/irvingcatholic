name: Link check

# Directories rot: parishes change hosts, small businesses let domains lapse.
# This runs weekly rather than per pull request, so a third-party host having a
# bad morning can never block a merge. Results land in one issue that is
# updated in place and closed automatically when everything is reachable.
on:
  schedule:
    - cron: '23 14 * * 1' # Mondays, 14:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    name: Check outbound links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check every listing website and CDN asset
        id: check
        continue-on-error: true
        run: node scripts/check-external-links.mjs --report "${RUNNER_TEMP}/link-report.md"

      - name: Report
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/link-report.md
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const failed = process.env.CHECK_OUTCOME === 'failure';
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? fs.readFileSync(process.env.REPORT_PATH, 'utf8')
              : 'The link check did not produce a report — see the workflow logs.';
            const title = 'Broken links in the directory';
            const marker = '<!-- link-check -->';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'link-rot',
              per_page: 20,
            });
            const existing = issues.find((i) => i.body?.includes(marker));

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              report,
              '',
              `_Checked ${new Date().toISOString().slice(0, 10)} — [workflow run](${runUrl})._`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            if (failed) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['link-rot'],
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  'Every outbound link is reachable again — closing.',
                  '',
                  '---',
                  '_Generated by [Claude Code](https://claude.ai/code)_',
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
